<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ardor has a new desktop app</title>
    <link rel="stylesheet" href="./migration.css" />
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">A</div>
      <p class="eyebrow">ARDOR DESKTOP</p>
      <h1>A new Ardor app is ready</h1>
      <p class="description">
        We rebuilt Ardor Desktop on a new foundation. Download and install the latest version to
        keep receiving updates.
      </p>
      <button id="download" type="button">Open download page</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p class="note">The page contains the current macOS Apple Silicon DMG and Windows installer.</p>
    </main>
    <script src="./migration.js"></script>
  </body>
</html>
