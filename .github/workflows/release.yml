name: Release

on:
  workflow_dispatch:
    inputs:
      noop:
        description: Run semantic-release in dry-run mode
        required: false
        type: boolean
        default: true
      existing_release_tag:
        description: Existing draft release tag to resume asset build/upload for
        required: false
        type: string
        default: ""
      macos_release_mode:
        description: macOS distribution mode (ad-hoc requires absent Apple credentials)
        required: true
        type: choice
        options:
          - developer-id
          - macos-adhoc
        default: developer-id

permissions:
  contents: read

jobs:
  slack-start:
    name: Send initial Slack message
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.slack-post.outputs.ts }}
      details: ${{ steps.msg.outputs.details }}
      start_epoch: ${{ steps.timer.outputs.epoch }}
      slack_enabled: ${{ steps.slack-config.outputs.enabled }}
    steps:
      - name: Record Start Time
        id: timer
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Detect Slack configuration
        id: slack-config
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_CHANNEL_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Slack secrets are not configured; skipping Slack notifications."
          fi

      - name: Formulate Message
        id: msg
        run: |
          if [ -n "${{ inputs.existing_release_tag }}" ]; then
            MODE="Resume ${{ inputs.existing_release_tag }}"
          elif [ "${{ inputs.noop }}" = "true" ]; then
            MODE="Dry run"
          else
            MODE="Release"
          fi

          DETAILS="*Triggered by:* ${{ github.triggering_actor || github.actor }}\n*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Release #${{ github.run_number }}>\n*Repository:* ${{ github.repository }}\n*Ref:* ${{ github.ref_name }}\n*Mode:* $MODE"
          MESSAGE="⏳ *Desktop release started*...\n$DETAILS"

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "message<<$EOF" >> "$GITHUB_OUTPUT"
          echo -e "$MESSAGE" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"
          echo "details<<$EOF" >> "$GITHUB_OUTPUT"
          echo -e "$DETAILS" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Send Initial Slack Message
        id: slack-post
        if: steps.slack-config.outputs.enabled == 'true'
        uses: slackapi/slack-github-action@e28cf165c92ffef168d23c5c9000cffc8a25e117 # v1.24.0
        with:
          channel-id: '${{ secrets.SLACK_CHANNEL_ID }}'
          payload: |
            { "text": ${{ toJSON(steps.msg.outputs.message) }} }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  release:
    name: Release
    needs: slack-start
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      BUN_CONFIG_AUDIT: "false"
      NODE_OPTIONS: "--max-old-space-size=4096"
    permissions:
      contents: read
    outputs:
      released: ${{ steps.released-tag.outputs.released }}
      tag: ${{ steps.released-tag.outputs.tag }}
      solutions_ui_ref: ${{ steps.solutions-ui-ref.outputs.sha }}
      macos_signing_mode: ${{ steps.macos-release-plan.outputs.mode }}
      release_asset_matrix: ${{ steps.macos-release-plan.outputs.asset_matrix }}
      release_ui_platforms: ${{ steps.macos-release-plan.outputs.ui_platforms }}

    steps:
      - name: Validate release ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Desktop releases must be dispatched from the main branch" >&2
            exit 1
          fi

      - name: Create desktop release app token
        id: desktop-release-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ardor-desktop
          permission-contents: write

      - name: Create read-only solutions-ui app token
        id: solutions-ui-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: solutions-ui
          permission-contents: read

      - name: Get release app bot user id
        id: release-app-user
        env:
          GH_TOKEN: ${{ steps.desktop-release-app-token.outputs.token }}
        run: |
          echo "user-id=$(gh api '/users/${{ steps.desktop-release-app-token.outputs.app-slug }}[bot]' --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Checkout release branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.desktop-release-app-token.outputs.token }}
          persist-credentials: false

      - name: Force workflow SHA
        run: git reset --hard ${{ github.sha }}

      - name: Validate requested draft release tag
        id: resume-release
        if: inputs.existing_release_tag != ''
        env:
          GH_TOKEN: ${{ steps.desktop-release-app-token.outputs.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.existing_release_tag }}
        run: |
          if ! [[ "$REQUESTED_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $REQUESTED_RELEASE_TAG" >&2
            exit 1
          fi

          git rev-parse --verify --quiet "refs/tags/$REQUESTED_RELEASE_TAG" >/dev/null || {
            echo "Release tag $REQUESTED_RELEASE_TAG does not exist" >&2
            exit 1
          }

          is_draft="$(gh release view "$REQUESTED_RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)"
          if [ "$is_draft" != "true" ]; then
            echo "Refusing to resume $REQUESTED_RELEASE_TAG because it is not a draft release" >&2
            exit 1
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$REQUESTED_RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Select immutable desktop UI requirements
        id: ui-requirements
        env:
          RESUME_RELEASE_TAG: ${{ steps.resume-release.outputs.tag }}
        run: |
          requirements_path="$RUNNER_TEMP/desktop-ui-requirements.json"
          if [ -n "$RESUME_RELEASE_TAG" ]; then
            git show "$RESUME_RELEASE_TAG:desktop-ui-requirements.json" > "$requirements_path"
          else
            cp desktop-ui-requirements.json "$requirements_path"
          fi
          echo "path=$requirements_path" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.1

      - name: Resolve macOS release signing mode and targets
        id: macos-release-plan
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ steps.desktop-release-app-token.outputs.token }}
          REQUESTED_MACOS_RELEASE_MODE: ${{ inputs.macos_release_mode }}
          RESUME_RELEASE_TAG: ${{ steps.resume-release.outputs.tag }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/macos-release-plan.txt"
          node scripts/macos-release-signing.mjs workflow > "$plan"
          cat "$plan" >> "$GITHUB_OUTPUT"
          mode="$(sed -n 's/^mode=//p' "$plan")"

          case "$REQUESTED_MACOS_RELEASE_MODE" in
            developer-id) requested_mode=developer-id ;;
            macos-adhoc) requested_mode=ad-hoc ;;
            *)
              echo "Unsupported requested macOS release mode: $REQUESTED_MACOS_RELEASE_MODE" >&2
              exit 1
              ;;
          esac
          if [ "$mode" != "$requested_mode" ]; then
            echo "Requested macOS release mode $REQUESTED_MACOS_RELEASE_MODE does not match the configured Apple credential mode $mode" >&2
            exit 1
          fi

          if [ "$mode" = "ad-hoc" ]; then
            echo "::warning title=Unsigned macOS release::The release will contain a manual-install ad-hoc DMG only. Notarization, Browser Touch ID/passkey Keychain access, and macOS auto-update are disabled."
          fi

          if [ -n "$RESUME_RELEASE_TAG" ]; then
            release_body="$(gh release view "$RESUME_RELEASE_TAG" --repo "${{ github.repository }}" --json body --jq .body)"
            is_prerelease="$(gh release view "$RESUME_RELEASE_TAG" --repo "${{ github.repository }}" --json isPrerelease --jq .isPrerelease)"
            recorded_mode="$(printf '%s\n' "$release_body" | sed -n 's/^<!-- ardor-macos-signing-mode:\(ad-hoc\|developer-id\) -->$/\1/p' | head -n 1)"
            if [ -z "$recorded_mode" ]; then
              echo "Draft release $RESUME_RELEASE_TAG has no immutable macOS signing-mode marker" >&2
              exit 1
            fi
            if [ "$recorded_mode" != "$mode" ]; then
              echo "Draft release $RESUME_RELEASE_TAG was created for macOS mode $recorded_mode, but current credentials resolve to $mode" >&2
              exit 1
            fi
            expected_prerelease=false
            if [ "$mode" = "ad-hoc" ]; then expected_prerelease=true; fi
            if [ "$is_prerelease" != "$expected_prerelease" ]; then
              echo "Draft release $RESUME_RELEASE_TAG prerelease state does not match its immutable macOS mode $mode" >&2
              exit 1
            fi
          fi

      - name: Restore desktop Bun cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: desktop-release-${{ runner.os }}-${{ runner.arch }}-bun-1.3.5-${{ hashFiles('bun.lock') }}
          restore-keys: |
            desktop-release-${{ runner.os }}-${{ runner.arch }}-bun-1.3.5-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test release asset contract
        run: bun run test:release-assets

      - name: Resolve configured solutions-ui ref
        id: solutions-ui-ref
        env:
          GH_TOKEN: ${{ steps.solutions-ui-app-token.outputs.token }}
          REQUIREMENTS_PATH: ${{ steps.ui-requirements.outputs.path }}
        run: |
          pinned_ref="$(node -p "JSON.parse(require('fs').readFileSync(process.env.REQUIREMENTS_PATH, 'utf8')).solutionsUiRef")"
          sha="$(gh api "repos/Ardor-Cerebrum/solutions-ui/commits/${pinned_ref}" --jq .sha)"

          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve Ardor-Cerebrum/solutions-ui ref $pinned_ref" >&2
            exit 1
          fi

          main_status="$(gh api "repos/Ardor-Cerebrum/solutions-ui/compare/${sha}...main" --jq .status)"
          if [[ "$main_status" != "ahead" && "$main_status" != "identical" ]]; then
            echo "Refusing to release solutions-ui $sha because it is not contained in solutions-ui main" >&2
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved solutions-ui $pinned_ref to immutable commit $sha"

      - name: Checkout solutions-ui compatibility preflight
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Ardor-Cerebrum/solutions-ui
          ref: ${{ steps.solutions-ui-ref.outputs.sha }}
          path: solutions-ui-preflight
          fetch-depth: 1
          token: ${{ steps.solutions-ui-app-token.outputs.token }}
          persist-credentials: false

      - name: Verify desktop UI compatibility before release
        env:
          ARDOR_DESKTOP_UI_REQUIREMENTS_SOURCE: workspace-snapshot
          REQUIREMENTS_PATH: ${{ steps.ui-requirements.outputs.path }}
        run: |
          cp "$REQUIREMENTS_PATH" .desktop-ui-requirements.snapshot.json
          node scripts/verify-desktop-ui-contract.mjs solutions-ui-preflight "${{ steps.solutions-ui-ref.outputs.sha }}"

      - name: Restore preflight UI Bun cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: preflight-ui-${{ runner.os }}-${{ runner.arch }}-bun-1.3.5-${{ hashFiles('solutions-ui-preflight/bun.lock') }}
          restore-keys: |
            preflight-ui-${{ runner.os }}-${{ runner.arch }}-bun-1.3.5-

      - name: Install preflight UI dependencies
        working-directory: solutions-ui-preflight
        run: bun install --frozen-lockfile

      - name: Test preflight desktop auth callback boundary
        working-directory: solutions-ui-preflight
        run: >-
          bun run test --
          src/lib/auth0-desktop-callback-bridge.test.tsx
          src/lib/auth0-desktop-marker-recovery.integration.test.tsx
          src/app.test.tsx

      - name: Type-check preflight UI
        working-directory: solutions-ui-preflight
        run: bun run type-check

      - name: Remove preflight checkout
        run: rm -rf -- solutions-ui-preflight

      - name: Configure git committer
        run: |
          git config user.name "${{ steps.desktop-release-app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.release-app-user.outputs.user-id }}+${{ steps.desktop-release-app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Capture current release tag
        id: previous-release
        run: |
          tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Semantic Release dry run
        if: inputs.noop && inputs.existing_release_tag == ''
        env:
          GITHUB_TOKEN: ${{ steps.desktop-release-app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.desktop-release-app-token.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.release-app-user.outputs.user-id }}+${{ steps.desktop-release-app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.desktop-release-app-token.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.release-app-user.outputs.user-id }}+${{ steps.desktop-release-app-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: bun run release --dry-run

      - name: Semantic Release
        id: semantic
        if: inputs.noop != true && inputs.existing_release_tag == ''
        env:
          GITHUB_TOKEN: ${{ steps.desktop-release-app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.desktop-release-app-token.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.release-app-user.outputs.user-id }}+${{ steps.desktop-release-app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.desktop-release-app-token.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.release-app-user.outputs.user-id }}+${{ steps.desktop-release-app-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: bun run release

      - name: Detect released tag
        id: released-tag
        if: inputs.noop != true || inputs.existing_release_tag != ''
        run: |
          if [ -n "${{ steps.resume-release.outputs.tag }}" ]; then
            echo "tag=${{ steps.resume-release.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ] && [ "$tag" != "${{ steps.previous-release.outputs.tag }}" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft GitHub release
        if: steps.released-tag.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.desktop-release-app-token.outputs.token }}
        run: |
          if gh release view "${{ steps.released-tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "GitHub Release for ${{ steps.released-tag.outputs.tag }} already exists"
            exit 0
          fi

          gh release create "${{ steps.released-tag.outputs.tag }}" --generate-notes --draft --verify-tag

      - name: Record immutable macOS distribution mode
        if: steps.released-tag.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.desktop-release-app-token.outputs.token }}
          MACOS_RELEASE_SIGNING_MODE: ${{ steps.macos-release-plan.outputs.mode }}
          RELEASE_TAG: ${{ steps.released-tag.outputs.tag }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/release-body.md"
          updated_body="$RUNNER_TEMP/release-body-with-macos-mode.md"
          marker="<!-- ardor-macos-signing-mode:${MACOS_RELEASE_SIGNING_MODE} -->"
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json body --jq .body > "$body"

          if grep -Fq "$marker" "$body"; then
            exit 0
          fi
          if grep -Fq '<!-- ardor-macos-signing-mode:' "$body"; then
            echo "Release $RELEASE_TAG already records a different macOS signing mode" >&2
            exit 1
          fi

          {
            printf '%s\n\n' "$marker"
            if [ "$MACOS_RELEASE_SIGNING_MODE" = "ad-hoc" ]; then
              cat <<'WARNING'
          > [!WARNING]
          > The macOS build is an ad-hoc-signed, non-notarized manual distribution. Only an
          > `-unsigned.dmg` is provided: macOS auto-update, Browser Touch ID/passkey Keychain
          > integration, and a Windows build are not included in this release. After downloading
          > from this official release, first try to open Ardor and dismiss the warning. Then open
          > System Settings > Privacy & Security, click Open Anyway, and confirm Open. See
          > [Apple's instructions](https://support.apple.com/102445).
          > Existing Ardor Desktop installations will not migrate automatically; install this Electron
          > prerelease manually. It intentionally does not replace the latest Tauri updater release.
          > Because each ad-hoc build has a different code identity, macOS may request Keychain/Safe Storage
          > approval again after a later manual unsigned update.

          WARNING
            fi
            cat "$body"
          } > "$updated_body"
          if [ "$MACOS_RELEASE_SIGNING_MODE" = "ad-hoc" ]; then
            gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --notes-file "$updated_body" --prerelease
          else
            gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --notes-file "$updated_body" --prerelease=false
          fi

  build-release-ui:
    name: Build ${{ matrix.target_platform }} production release UI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_platform: ${{ fromJSON(needs.release.outputs.release_ui_platforms) }}
    concurrency:
      group: release-ui-${{ needs.release.outputs.tag }}-prod-${{ matrix.target_platform }}
      cancel-in-progress: false
    env:
      BUN_CONFIG_AUDIT: "false"
      NODE_OPTIONS: "--max-old-space-size=4096"
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      SOLUTIONS_UI_REF: ${{ needs.release.outputs.solutions_ui_ref }}
    permissions:
      contents: read

    steps:
      - name: Create read-only solutions-ui app token
        id: solutions-ui-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: solutions-ui
          permission-contents: read

      - name: Checkout desktop release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: ardor-desktop
          persist-credentials: false

      - name: Checkout solutions-ui
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Ardor-Cerebrum/solutions-ui
          ref: ${{ env.SOLUTIONS_UI_REF }}
          path: solutions-ui
          fetch-depth: 1
          token: ${{ steps.solutions-ui-app-token.outputs.token }}
          persist-credentials: false

      - name: Verify desktop UI compatibility
        run: node ardor-desktop/scripts/verify-desktop-ui-contract.mjs solutions-ui "$SOLUTIONS_UI_REF"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Restore UI Bun cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: release-ui-${{ runner.os }}-${{ runner.arch }}-bun-1.3.5-${{ hashFiles('solutions-ui/bun.lock') }}
          restore-keys: |
            release-ui-${{ runner.os }}-${{ runner.arch }}-bun-1.3.5-

      - name: Install UI dependencies
        working-directory: solutions-ui
        run: bun install --frozen-lockfile

      - name: Build production UI
        working-directory: ardor-desktop
        env:
          ARDOR_DESKTOP_TARGET_PLATFORM: ${{ matrix.target_platform }}
          VITE_API_URL: ${{ vars.DESKTOP_PROD_API_URL }}
          VITE_ARTIFACT_API_URL: ${{ vars.DESKTOP_PROD_ARTIFACT_API_URL }}
          VITE_AUTH0_DOMAIN: ${{ vars.DESKTOP_PROD_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.DESKTOP_PROD_AUTH0_CLIENT_ID }}
          VITE_AMPLITUDE_API_KEY: ${{ vars.DESKTOP_PROD_AMPLITUDE_API_KEY }}
          VITE_DESKTOP_SENTRY_DSN: ${{ vars.DESKTOP_PROD_SENTRY_DSN }}
          VITE_STRIPE_PRICING_TABLE_ID: ${{ vars.DESKTOP_PROD_STRIPE_PRICING_TABLE_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.DESKTOP_PROD_STRIPE_PUBLISHABLE_KEY }}
        run: bun run ui:build:prod

      - name: Upload release UI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-ui-prod-${{ matrix.target_platform }}
          path: solutions-ui/dist
          if-no-files-found: error
          retention-days: 7

  build-release-assets:
    name: Build ${{ matrix.label }} release asset
    needs: [release, build-release-ui]
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release.outputs.release_asset_matrix) }}
    concurrency:
      group: release-assets-${{ needs.release.outputs.tag }}-${{ matrix.id }}
      cancel-in-progress: false
    env:
      BUN_CONFIG_AUDIT: "false"
      NODE_OPTIONS: "--max-old-space-size=4096"
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      MACOS_RELEASE_SIGNING_MODE: ${{ needs.release.outputs.macos_signing_mode }}
    permissions:
      contents: read

    steps:
      - name: Checkout desktop release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: ardor-desktop
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Restore desktop Bun and Electron caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
            ~/Library/Caches/electron
            ~\AppData\Local\electron\Cache
          key: release-assets-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ matrix.arch }}-bun-1.3.5-electron-${{ hashFiles('ardor-desktop/bun.lock') }}
          restore-keys: |
            release-assets-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ matrix.arch }}-bun-1.3.5-electron-

      - name: Verify macOS SDK
        if: matrix.platform == 'darwin'
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          clang --version

      - name: Install desktop dependencies
        working-directory: ardor-desktop
        run: bun install --frozen-lockfile

      - name: Import Apple signing certificate and notarization key
        if: matrix.platform == 'darwin' && needs.release.outputs.macos_signing_mode == 'developer-id'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_P12_BASE64:?APPLE_CERTIFICATE_P12_BASE64 is required}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD is required}"
          : "${APPLE_KEYCHAIN_PASSWORD:?APPLE_KEYCHAIN_PASSWORD is required}"
          : "${APPLE_SIGNING_IDENTITY:?APPLE_SIGNING_IDENTITY is required}"
          : "${APPLE_API_KEY_P8_BASE64:?APPLE_API_KEY_P8_BASE64 is required}"
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID is required}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER is required}"

          keychain_path="$RUNNER_TEMP/ardor-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security find-identity -p codesigning -v "$keychain_path"

          apple_team_id="$(
            openssl pkcs12 -in "$certificate_path" -clcerts -nokeys -passin "pass:$APPLE_CERTIFICATE_PASSWORD" |
              openssl x509 -noout -subject -nameopt RFC2253 |
              sed -n 's/.*OU=\([^,]*\).*/\1/p'
          )"
          [[ "$apple_team_id" =~ ^[A-Z0-9]{10}$ ]] || {
            echo "Unable to derive the Apple Team ID from the signing certificate" >&2
            exit 1
          }

          {
            echo "APPLE_KEYCHAIN_PATH=$keychain_path"
            echo "APPLE_API_KEY=$api_key_path"
            echo "APPLE_TEAM_ID=$apple_team_id"
          } >> "$GITHUB_ENV"

      - name: Materialize Windows signing certificate
        if: matrix.platform == 'win32'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) {
            Write-Host 'No PFX secret configured; Forge will require the configured custom signing provider.'
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'ardor-code-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          )
          "WINDOWS_CERTIFICATE_FILE=$certificatePath" >> $env:GITHUB_ENV

      - name: Download prebuilt release UI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-ui-prod-${{ matrix.ui_platform }}
          path: solutions-ui/dist

      - name: Build production Electron app
        working-directory: ardor-desktop
        env:
          ARDOR_SKIP_UI_BUILD: "true"
          ARDOR_SOLUTIONS_UI_DIR: ../solutions-ui
          ARDOR_ELECTRON_CHANNEL: prod
          VITE_API_URL: ${{ vars.DESKTOP_PROD_API_URL }}
          VITE_ARTIFACT_API_URL: ${{ vars.DESKTOP_PROD_ARTIFACT_API_URL }}
          VITE_AUTH0_DOMAIN: ${{ vars.DESKTOP_PROD_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.DESKTOP_PROD_AUTH0_CLIENT_ID }}
          VITE_AMPLITUDE_API_KEY: ${{ vars.DESKTOP_PROD_AMPLITUDE_API_KEY }}
          VITE_DESKTOP_SENTRY_DSN: ${{ vars.DESKTOP_PROD_SENTRY_DSN }}
          VITE_STRIPE_PRICING_TABLE_ID: ${{ vars.DESKTOP_PROD_STRIPE_PRICING_TABLE_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.DESKTOP_PROD_STRIPE_PUBLISHABLE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ needs.release.outputs.macos_signing_mode == 'developer-id' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY_ID: ${{ needs.release.outputs.macos_signing_mode == 'developer-id' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ needs.release.outputs.macos_signing_mode == 'developer-id' && secrets.APPLE_API_ISSUER || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNTOOL_PATH: ${{ vars.WINDOWS_SIGNTOOL_PATH }}
          WINDOWS_SIGN_WITH_PARAMS: ${{ secrets.WINDOWS_SIGN_WITH_PARAMS }}
          WINDOWS_TIMESTAMP_SERVER: ${{ vars.WINDOWS_TIMESTAMP_SERVER }}
          WINDOWS_SIGN_DESCRIPTION: Ardor desktop application
          WINDOWS_SIGN_WEBSITE: https://ardor.cloud
        run: bun scripts/electron-stage-build.mjs prod --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Verify production macOS package integrity
        if: matrix.platform == 'darwin'
        working-directory: ardor-desktop
        run: |
          app_bundle="$(find out -type d -name 'Ardor.app' -print -quit)"
          test -n "$app_bundle"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          bun run verify:electron-fuses -- "$app_bundle"

      - name: Verify notarized macOS distribution
        if: matrix.platform == 'darwin' && needs.release.outputs.macos_signing_mode == 'developer-id'
        working-directory: ardor-desktop
        run: |
          app_bundle="$(find out -type d -name 'Ardor.app' -print -quit)"
          entitlements="$RUNNER_TEMP/ardor-entitlements.plist"
          codesign -d --entitlements "$entitlements" "$app_bundle"
          test "$(plutil -extract keychain-access-groups.0 raw -o - "$entitlements")" = \
            "${APPLE_TEAM_ID}.cloud.ardor.desktop.webauthn"
          runtime_config="$app_bundle/Contents/Resources/runtime-config.json"
          node -e 'const config = require(process.argv[1]); if (config.browserWebAuthnKeychainAccessGroup !== process.env.APPLE_TEAM_ID + ".cloud.ardor.desktop.webauthn" || config.autoUpdateEnabled !== true) process.exit(1)' "$runtime_config"
          spctl --assess --type execute --verbose=4 "$app_bundle"
          xcrun stapler validate "$app_bundle"

      - name: Verify ad-hoc macOS distribution boundary
        if: matrix.platform == 'darwin' && needs.release.outputs.macos_signing_mode == 'ad-hoc'
        working-directory: ardor-desktop
        run: |
          package_app="$(find out -type d -name 'Ardor.app' -print -quit)"
          dmg="$(find out/make -type f -name '*.dmg' -print -quit)"
          test -n "$package_app"
          test -n "$dmg"

          mount_dir="$RUNNER_TEMP/ardor-ad-hoc-dmg"
          mkdir -p "$mount_dir"
          cleanup_dmg() { hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; }
          trap cleanup_dmg EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          dmg_app="$mount_dir/Ardor.app"
          test -d "$dmg_app"

          index=0
          for app_bundle in "$package_app" "$dmg_app"; do
            index=$((index + 1))
            codesign --verify --deep --strict --verbose=2 "$app_bundle"
            signature_details="$(codesign -dvv "$app_bundle" 2>&1)"
            printf '%s\n' "$signature_details" | grep -F 'Signature=adhoc'
            if printf '%s\n' "$signature_details" | grep -Eq '^TeamIdentifier=[A-Z0-9]+$'; then
              echo "Ad-hoc macOS release unexpectedly has an Apple Team identifier" >&2
              exit 1
            fi

            entitlements="$RUNNER_TEMP/ardor-ad-hoc-entitlements-$index.plist"
            codesign -d --entitlements :- "$app_bundle" > "$entitlements" 2>/dev/null
            if grep -Fq '<key>keychain-access-groups</key>' "$entitlements"; then
              echo "Ad-hoc macOS release must not contain a Keychain access group" >&2
              exit 1
            fi

            runtime_config="$app_bundle/Contents/Resources/runtime-config.json"
            node -e 'const config = require(process.argv[1]); if ("browserWebAuthnKeychainAccessGroup" in config || config.autoUpdateEnabled !== false) process.exit(1)' "$runtime_config"
          done
          hdiutil detach "$mount_dir"
          trap - EXIT
          echo "::warning title=Manual macOS distribution::Verified ad-hoc signature with no Browser Keychain entitlement, no runtime access group, and auto-update disabled."

      - name: Verify production Windows signatures and Electron fuses
        if: matrix.platform == 'win32'
        working-directory: ardor-desktop
        shell: pwsh
        run: |
          $packageDirectory = Get-ChildItem -Path out -Directory |
            Where-Object { $_.Name -ne 'make' } |
            Select-Object -First 1
          if (-not $packageDirectory) { throw 'Packaged Windows application is missing' }

          $appExecutable = Get-ChildItem -Path $packageDirectory.FullName -File -Filter '*.exe' |
            Select-Object -First 1
          if (-not $appExecutable) { throw 'Packaged Windows application executable is missing' }
          bun run verify:electron-fuses -- $appExecutable.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Electron fuse verification failed' }

          $signableFiles = Get-ChildItem -Path $packageDirectory.FullName -Recurse -File -Include *.exe,*.dll,*.node
          $invalidFiles = $signableFiles | Where-Object {
            (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid'
          }
          if ($invalidFiles) {
            $invalidFiles.FullName | Write-Error
            throw 'Packaged Windows application contains unsigned or invalid binaries'
          }

          $installer = Get-ChildItem -Path out/make -Recurse -File -Filter '*.exe' |
            Select-Object -First 1
          if (-not $installer) { throw 'Windows installer is missing' }
          $installerSignature = Get-AuthenticodeSignature $installer.FullName
          if ($installerSignature.Status -ne 'Valid') {
            throw "Windows installer signature is $($installerSignature.Status)"
          }

      - name: Collect and validate Electron release assets
        working-directory: ardor-desktop
        env:
          ARDOR_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
        run: node scripts/electron-release-assets.mjs "${{ matrix.platform }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ matrix.id }}
          path: ardor-desktop/dist/release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Clean Apple signing material
        if: always() && matrix.platform == 'darwin'
        shell: bash
        run: |
          if [ -n "${APPLE_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH" 2>/dev/null || true
          fi
          if [ -n "${APPLE_API_KEY:-}" ]; then
            rm -f -- "$APPLE_API_KEY"
          fi
          rm -f -- "$RUNNER_TEMP/developer-id-application.p12"

      - name: Clean Windows signing material
        if: always() && matrix.platform == 'win32'
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_FILE)) {
            Remove-Item -Force $env:WINDOWS_CERTIFICATE_FILE -ErrorAction SilentlyContinue
          }

  upload-release-assets:
    name: Upload release assets
    needs: [release, build-release-assets]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-upload-${{ needs.release.outputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read

    steps:
      - name: Create release app token
        id: release-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ardor-desktop
          permission-contents: write

      - name: Verify draft release
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          release_state="$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json body,isDraft,isPrerelease)"
          release_body="$(printf '%s' "$release_state" | jq -r .body)"
          is_draft="$(printf '%s' "$release_state" | jq -r .isDraft)"
          is_prerelease="$(printf '%s' "$release_state" | jq -r .isPrerelease)"
          if [ "$is_draft" != "true" ]; then
            echo "Expected $RELEASE_TAG to remain a draft until all release assets are uploaded" >&2
            exit 1
          fi
          expected_prerelease=false
          expected_marker='<!-- ardor-macos-signing-mode:${{ needs.release.outputs.macos_signing_mode }} -->'
          if [ "$(printf '%s\n' "$release_body" | grep -Fxc "$expected_marker")" -ne 1 ]; then
            echo "Release $RELEASE_TAG no longer contains exactly one immutable macOS signing-mode marker" >&2
            exit 1
          fi
          if [ "${{ needs.release.outputs.macos_signing_mode }}" = "ad-hoc" ]; then
            expected_prerelease=true
            if ! printf '%s\n' "$release_body" | grep -Fq '> The macOS build is an ad-hoc-signed, non-notarized manual distribution.'; then
              echo "Release $RELEASE_TAG no longer contains the required ad-hoc distribution warning" >&2
              exit 1
            fi
          fi
          if [ "$is_prerelease" != "$expected_prerelease" ]; then
            echo "Release $RELEASE_TAG prerelease state does not match its macOS signing mode" >&2
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -maxdepth 1 -type f -print

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          set -euo pipefail
          # The draft marker and prerelease state were verified before rebuilding. Forge archives
          # are nondeterministic, so a same-mode resume must replace matching draft assets.
          gh release upload "$RELEASE_TAG" release-assets/* --repo "${{ github.repository }}" --clobber

          find release-assets -maxdepth 1 -type f -exec basename {} \; | sort > "$RUNNER_TEMP/expected-release-assets.txt"
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/actual-release-assets.txt"
          diff -u "$RUNNER_TEMP/expected-release-assets.txt" "$RUNNER_TEMP/actual-release-assets.txt"

      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          if [ "${{ needs.release.outputs.macos_signing_mode }}" = "ad-hoc" ]; then
            gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --draft=false --prerelease=false --latest
          fi

  slack-update:
    name: Update Slack message
    needs: [slack-start, release, build-release-ui, build-release-assets, upload-release-assets]
    if: always() && needs.slack-start.outputs.slack_enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Determine Status
        id: status
        run: |
          if [ "${{ needs.release.result }}" != "success" ]; then
            echo "icon=❌" >> "$GITHUB_OUTPUT"
            echo "text=failed before release creation" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.release.outputs.released }}" != "true" ]; then
            echo "icon=ℹ️" >> "$GITHUB_OUTPUT"
            echo "text=completed without a new release" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.build-release-ui.result }}" = "success" ] && [ "${{ needs.build-release-assets.result }}" = "success" ] && [ "${{ needs.upload-release-assets.result }}" = "success" ]; then
            echo "icon=✅" >> "$GITHUB_OUTPUT"
            echo "text=completed successfully" >> "$GITHUB_OUTPUT"
          else
            echo "icon=❌" >> "$GITHUB_OUTPUT"
            echo "text=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute Duration
        id: duration
        run: |
          START="${{ needs.slack-start.outputs.start_epoch }}"
          END=$(date +%s)
          if [ -z "$START" ] || [ "$START" -le 0 ]; then
            echo "value=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ELAPSED=$((END - START))
          if [ "$ELAPSED" -ge 3600 ]; then
            H=$((ELAPSED / 3600))
            M=$((ELAPSED % 3600 / 60))
            S=$((ELAPSED % 60))
            DURATION="${H}h ${M}m ${S}s"
          elif [ "$ELAPSED" -ge 60 ]; then
            M=$((ELAPSED / 60))
            S=$((ELAPSED % 60))
            DURATION="${M}m ${S}s"
          else
            DURATION="${ELAPSED}s"
          fi

          echo "value=$DURATION" >> "$GITHUB_OUTPUT"

      - name: Formulate Update Message
        id: msg
        run: |
          DETAILS="${{ needs.slack-start.outputs.details }}"
          TAG="${{ needs.release.outputs.tag }}"

          if [ -n "$TAG" ]; then
            RELEASE_LINE="*Release:* <${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG|$TAG>"
          else
            RELEASE_LINE="*Release:* none"
          fi

          MESSAGE="${{ steps.status.outputs.icon }} *Desktop release ${{ steps.status.outputs.text }}!*\n*Duration:* ${{ steps.duration.outputs.value }}\n$RELEASE_LINE\n$DETAILS"

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "message<<$EOF" >> "$GITHUB_OUTPUT"
          echo -e "$MESSAGE" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Update Slack Message
        uses: slackapi/slack-github-action@e28cf165c92ffef168d23c5c9000cffc8a25e117 # v1.24.0
        with:
          channel-id: '${{ secrets.SLACK_CHANNEL_ID }}'
          update-ts: ${{ needs.slack-start.outputs.ts }}
          payload: |
            { "text": ${{ toJSON(steps.msg.outputs.message) }} }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
