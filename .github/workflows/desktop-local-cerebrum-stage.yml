name: Build local Cerebrum stage candidates

on:
  workflow_dispatch:
    inputs:
      solutions_ui_sha:
        description: Override the pinned stage solutions-ui candidate with an exact commit.
        required: false
        type: string
  pull_request:
    paths:
      - .github/workflows/desktop-local-cerebrum-stage.yml
      - desktop-cerebrum-requirements.json

permissions:
  contents: read

concurrency:
  group: desktop-local-cerebrum-stage-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }} stage candidate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-26
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
          - label: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
    env:
      BUN_CONFIG_AUDIT: "false"
      CODEX_REPO_ROOT: ${{ github.workspace }}/cerebrum-source
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      NODE_OPTIONS: --max-old-space-size=4096
      # Stage candidate from solutions-ui PR #718; the published release pin stays separate.
      STAGE_SOLUTIONS_UI_SHA: c431ba0bcdd230722e21823922fcb2ad4229debd
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Desktop source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ardor-desktop
          persist-credentials: false

      - name: Validate immutable source pins
        id: pins
        working-directory: ardor-desktop
        env:
          SOLUTIONS_UI_SHA: ${{ inputs.solutions_ui_sha }}
        run: |
          set -euo pipefail
          SOLUTIONS_UI_SHA="${SOLUTIONS_UI_SHA:-$STAGE_SOLUTIONS_UI_SHA}"
          [[ "$SOLUTIONS_UI_SHA" =~ ^[0-9a-f]{40}$ ]]
          cerebrum_sha="$(node -p "JSON.parse(require('node:fs').readFileSync('desktop-cerebrum-requirements.json', 'utf8')).sourceCommit")"
          [[ "$cerebrum_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'cerebrum_sha=%s\n' "$cerebrum_sha" >> "$GITHUB_OUTPUT"
          printf 'solutions_ui_sha=%s\n' "$SOLUTIONS_UI_SHA" >> "$GITHUB_OUTPUT"

      - name: Create read-only candidate source token
        id: solutions-ui-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            solutions-ui
            cerebrum
          permission-contents: read

      - name: Checkout pinned solutions-ui
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Ardor-Cerebrum/solutions-ui
          ref: ${{ steps.pins.outputs.solutions_ui_sha }}
          path: solutions-ui
          token: ${{ steps.solutions-ui-token.outputs.token }}
          persist-credentials: false

      - name: Checkout pinned Cerebrum source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Ardor-Cerebrum/cerebrum
          ref: ${{ steps.pins.outputs.cerebrum_sha }}
          path: cerebrum-source
          token: ${{ steps.solutions-ui-token.outputs.token }}
          persist-credentials: false

      - name: Verify checkout pins
        env:
          CEREBRUM_SHA: ${{ steps.pins.outputs.cerebrum_sha }}
          SOLUTIONS_UI_SHA: ${{ steps.pins.outputs.solutions_ui_sha }}
        run: |
          set -euo pipefail
          test "$(git -C cerebrum-source rev-parse HEAD)" = "$CEREBRUM_SHA"
          test "$(git -C solutions-ui rev-parse HEAD)" = "$SOLUTIONS_UI_SHA"

      - name: Verify Desktop UI bridge contract
        env:
          ARDOR_DESKTOP_UI_REQUIREMENTS_SOURCE: workspace-snapshot
          SOLUTIONS_UI_SHA: ${{ steps.pins.outputs.solutions_ui_sha }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const requirements = JSON.parse(readFileSync("ardor-desktop/desktop-ui-requirements.json", "utf8"));
            const cerebrum = JSON.parse(readFileSync("ardor-desktop/desktop-cerebrum-requirements.json", "utf8"));
            requirements.solutionsUiRef = process.env.SOLUTIONS_UI_SHA;
            requirements.requiredCapabilities = [...new Set([
              ...requirements.requiredCapabilities,
              ...cerebrum.requiredUiCapabilities,
            ])];
            writeFileSync(".desktop-ui-requirements.snapshot.json", `${JSON.stringify(requirements, null, 2)}\n`);
          '
          node ardor-desktop/scripts/verify-desktop-ui-contract.mjs solutions-ui "$SOLUTIONS_UI_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Test Cerebrum delivery contract
        working-directory: cerebrum-source
        run: python -m unittest discover -s scripts/release -p test_desktop_runtime.py

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Verify pinned V8 inputs
        uses: ./cerebrum-source/.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Configure Windows native compiler
        if: matrix.platform == 'win32'
        uses: ./cerebrum-source/.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Build Cerebrum runtime and native helpers
        working-directory: cerebrum-source/codex-rs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binaries=(--bin codex --bin codex-code-mode-host)
          if [[ "$TARGET" == *windows* ]]; then
            binaries+=(--bin codex-command-runner --bin codex-windows-sandbox-setup)
          fi
          cargo build --locked --release --target "$TARGET" "${binaries[@]}"

      - name: Assemble and smoke Cerebrum runtime package
        working-directory: cerebrum-source
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          release="codex-rs/target/$TARGET/release"
          suffix=""
          if [[ "$TARGET" == *windows* ]]; then
            suffix=".exe"
            python scripts/build_codex_package.py --target "$TARGET" --variant codex \
              --entrypoint-bin "$release/codex$suffix" \
              --code-mode-host-bin "$release/codex-code-mode-host$suffix" \
              --package-dir desktop-runtime-package \
              --codex-command-runner-bin "$release/codex-command-runner.exe" \
              --codex-windows-sandbox-setup-bin "$release/codex-windows-sandbox-setup.exe"
          else
            python scripts/build_codex_package.py --target "$TARGET" --variant codex \
              --entrypoint-bin "$release/codex$suffix" \
              --code-mode-host-bin "$release/codex-code-mode-host$suffix" \
              --package-dir desktop-runtime-package
          fi
          python scripts/release/desktop_runtime.py smoke --package desktop-runtime-package
          python scripts/release/desktop_runtime.py seal --package desktop-runtime-package \
            --output desktop-runtime-output --commit "${{ steps.pins.outputs.cerebrum_sha }}"
          archive="$GITHUB_WORKSPACE/cerebrum-source/desktop-runtime-output/cerebrum-desktop-$TARGET.zip"
          test -s "$archive"
          printf 'ARDOR_CEREBRUM_ARCHIVE_SHA256=%s\n' "$(sha256sum "$archive" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          printf 'ARDOR_CEREBRUM_SOURCE_SHA=%s\n' "${{ steps.pins.outputs.cerebrum_sha }}" >> "$GITHUB_ENV"

      - name: Install Desktop dependencies
        working-directory: ardor-desktop
        run: bun install --frozen-lockfile

      - name: Install pinned UI dependencies
        working-directory: solutions-ui
        run: bun install --frozen-lockfile

      - name: Build and package stage1 Desktop
        working-directory: ardor-desktop
        env:
          ARDOR_ELECTRON_CHANNEL: stage1
          ARDOR_SOLUTIONS_UI_DIR: ../solutions-ui
          ARDOR_DESKTOP_TARGET_PLATFORM: ${{ matrix.platform }}
          ARDOR_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
        run: bun scripts/electron-stage-build.mjs stage1 --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Verify bundled runtime in the packaged Desktop app
        working-directory: ardor-desktop
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_PLATFORM" == "darwin" ]]; then
            app_bundle="$(find out -type d -name 'Ardor Dev.app' -print -quit)"
            test -n "$app_bundle"
            package_root="$(dirname "$app_bundle")"
            runtime_package="$app_bundle/Contents/Resources/cerebrum"
            fuse_target="$app_bundle"
          else
            package_root="$(find out -mindepth 1 -maxdepth 1 -type d ! -name make -print -quit)"
            test -n "$package_root"
            runtime_package="$package_root/resources/cerebrum"
            fuse_target="$package_root/Ardor Dev.exe"
          fi
          test -s "$runtime_package/manifest.json"
          ARDOR_ELECTRON_CHANNEL=stage1 ARDOR_ELECTRON_PACKAGE_DIR="$package_root" bun run test:electron-package
          bun run verify:electron-fuses -- "$fuse_target"
          python "$CODEX_REPO_ROOT/scripts/release/desktop_runtime.py" smoke --package "$runtime_package"
          bun run test:local-agent-packaged

      - name: Upload stage installer and runtime candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ardor-desktop-stage1-${{ matrix.target }}-${{ github.run_id }}
          path: |
            ardor-desktop/out/make/**
            cerebrum-source/desktop-runtime-output/**
          if-no-files-found: error
          retention-days: 14
