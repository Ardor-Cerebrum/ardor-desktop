name: Verify bundled solutions-ui

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - desktop-ui-requirements.json
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: bundled-ui-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  scope:
    name: Validate update scope
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
      pr_head_sha: ${{ steps.scope.outputs.pr_head_sha }}
    steps:
      - name: Require the generated pin-only pull request
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            trusted_base_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "pr_head_sha=$trusted_base_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HEAD_BRANCH" != "automation/solutions-ui-release" ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "The pin verification accepts only the generated same-repository branch" >&2
            exit 1
          fi
          if [ "$BASE_REPOSITORY" != "$GITHUB_REPOSITORY" ] || [ "$BASE_BRANCH" != "main" ]; then
            echo "The generated pin PR must target this repository's main branch" >&2
            exit 1
          fi
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          if [ "$files" != "desktop-ui-requirements.json" ]; then
            echo "The generated pin PR must change only desktop-ui-requirements.json" >&2
            exit 1
          fi
          echo "relevant=true" >> "$GITHUB_OUTPUT"
          echo "pr_head_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify production desktop bundle
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    runs-on: macos-26
    env:
      BUN_CONFIG_AUDIT: "false"
      NODE_OPTIONS: "--max-old-space-size=4096"
      UI_REPOSITORY: Ardor-Cerebrum/solutions-ui
    steps:
      - name: Checkout trusted desktop base without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Read requested solutions-ui pin as data
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ needs.scope.outputs.pr_head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/desktop-ui-requirements.json?ref=${PR_HEAD_SHA}" \
            --jq .content | base64 --decode > requested-desktop-ui-requirements.json
          schema="$(jq -r .schemaVersion requested-desktop-ui-requirements.json)"
          UI_TAG="$(jq -r .solutionsUiTag requested-desktop-ui-requirements.json)"
          UI_SHA="$(jq -r .solutionsUiRef requested-desktop-ui-requirements.json)"
          if [ "$schema" != "3" ]; then
            echo "Generated pin updates must use desktop UI requirements schema 3" >&2
            exit 1
          fi
          if ! [[ "$UI_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid solutions-ui release tag: $UI_TAG" >&2
            exit 1
          fi
          if ! [[ "$UI_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid solutions-ui release SHA: $UI_SHA" >&2
            exit 1
          fi
          echo "UI_TAG=$UI_TAG" >> "$GITHUB_ENV"
          echo "UI_SHA=$UI_SHA" >> "$GITHUB_ENV"

      - name: Create read-only solutions-ui app token
        id: ui-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: solutions-ui
          permission-contents: read

      - name: Validate published solutions-ui release
        env:
          GH_TOKEN: ${{ steps.ui-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/$UI_REPOSITORY/releases/tags/${UI_TAG}")"
          if [ "$(jq -r .draft <<<"$release")" != "false" ] || [ "$(jq -r .published_at <<<"$release")" = "null" ]; then
            echo "solutions-ui release $UI_TAG is not published" >&2
            exit 1
          fi
          resolved_sha="$(gh api "repos/$UI_REPOSITORY/commits/${UI_TAG}" --jq .sha)"
          if [ "$resolved_sha" != "$UI_SHA" ]; then
            echo "Release $UI_TAG resolves to $resolved_sha, not $UI_SHA" >&2
            exit 1
          fi
          main_status="$(gh api "repos/$UI_REPOSITORY/compare/${UI_SHA}...main" --jq .status)"
          if [ "$main_status" != "ahead" ] && [ "$main_status" != "identical" ]; then
            echo "Release $UI_TAG ($UI_SHA) is not contained in solutions-ui main" >&2
            exit 1
          fi
          current_sha="$(jq -r .solutionsUiRef desktop-ui-requirements.json)"
          if ! [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid current Desktop solutions-ui SHA: $current_sha" >&2
            exit 1
          fi
          candidate_status="$(gh api "repos/$UI_REPOSITORY/compare/${current_sha}...${UI_SHA}" --jq .status)"
          if ! [[ "$candidate_status" == "ahead" ||
                  ( "$EVENT_NAME" == "workflow_dispatch" && "$candidate_status" == "identical" ) ]]; then
            echo "Requested solutions-ui release does not advance the trusted Desktop base" >&2
            exit 1
          fi

      - name: Download verified solutions-ui source
        env:
          GH_TOKEN: ${{ steps.ui-token.outputs.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/solutions-ui.tar.gz"
          gh api -H "Accept: application/vnd.github+json" "repos/$UI_REPOSITORY/tarball/$UI_SHA" > "$archive"
          top_level="$(tar -tzf "$archive" | sed -n '1{s#/.*##;p;}')"
          if [ -z "$top_level" ] || tar -tzf "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Invalid solutions-ui source archive" >&2
            exit 1
          fi
          if tar -tzf "$archive" | awk -F/ -v root="$top_level" '$1 != root { invalid=1 } END { exit invalid ? 0 : 1 }'; then
            echo "solutions-ui source archive has multiple roots" >&2
            exit 1
          fi
          mkdir solutions-ui
          tar -xzf "$archive" --strip-components=1 -C solutions-ui

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Setup Node
        uses: actions/setup-node@1e60f620b9541d968a5b0c209fc452b1a30034d2 # v6.0.0
        with:
          node-version: 24.11.1

      - name: Apply validated pin to trusted desktop requirements
        run: |
          set -euo pipefail
          node scripts/solutions-ui-pin-policy.mjs verify \
            desktop-ui-requirements.json requested-desktop-ui-requirements.json "$UI_TAG" "$UI_SHA"
          node scripts/solutions-ui-pin-policy.mjs write desktop-ui-requirements.json "$UI_TAG" "$UI_SHA"

      - name: Verify solutions-ui desktop contract
        run: node scripts/verify-desktop-ui-contract.mjs solutions-ui "$UI_SHA"

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile

      - name: Install UI dependencies
        working-directory: solutions-ui
        run: bun install --frozen-lockfile

      - name: Build production UI
        env:
          ARDOR_DESKTOP_TARGET_PLATFORM: darwin
          VITE_API_URL: ${{ vars.DESKTOP_PROD_API_URL }}
          VITE_ARTIFACT_API_URL: ${{ vars.DESKTOP_PROD_ARTIFACT_API_URL }}
          VITE_AUTH0_DOMAIN: ${{ vars.DESKTOP_PROD_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.DESKTOP_PROD_AUTH0_CLIENT_ID }}
          VITE_AMPLITUDE_API_KEY: ${{ vars.DESKTOP_PROD_AMPLITUDE_API_KEY }}
          VITE_DESKTOP_SENTRY_DSN: ${{ vars.DESKTOP_PROD_SENTRY_DSN }}
          VITE_STRIPE_PRICING_TABLE_ID: ${{ vars.DESKTOP_PROD_STRIPE_PRICING_TABLE_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.DESKTOP_PROD_STRIPE_PUBLISHABLE_KEY }}
        run: bun run ui:build:prod

      - name: Build production Electron bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
          ARDOR_ELECTRON_CHANNEL: prod
          ARDOR_SPARKLE_FEED_URL: https://github.com/Ardor-Cerebrum/ardor-desktop/releases/download/electron-update-feed/macos-arm64.xml
          ARDOR_SPARKLE_PUBLIC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ARDOR_SKIP_UI_BUILD: "true"
          ARDOR_SOLUTIONS_UI_DIR: ${{ github.workspace }}/solutions-ui
          VITE_API_URL: ${{ vars.DESKTOP_PROD_API_URL }}
          VITE_ARTIFACT_API_URL: ${{ vars.DESKTOP_PROD_ARTIFACT_API_URL }}
          VITE_AUTH0_DOMAIN: ${{ vars.DESKTOP_PROD_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.DESKTOP_PROD_AUTH0_CLIENT_ID }}
        run: |
          bun run electron:sparkle:rebuild
          bun scripts/electron-stage-build.mjs prod --platform darwin --arch arm64
