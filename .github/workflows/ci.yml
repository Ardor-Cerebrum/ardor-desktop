name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  validate:
    name: Validate desktop
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check Electron shell
        run: bun run electron:type-check

      - name: Test Electron shell contracts
        run: |
          bun run test:electron-shell-contract
          bun test electron/auth/*.test.ts electron/browser/*.test.ts electron/updater.test.ts

      - name: Package Electron shell with a UI fixture
        working-directory: .
        env:
          ARDOR_UI_DIST_DIR: ${{ runner.temp }}/ardor-ui-dist
        run: |
          mkdir -p "$ARDOR_UI_DIST_DIR"
          printf '%s\n' '<!doctype html><title>Ardor UI fixture</title>' > "$ARDOR_UI_DIST_DIR/index.html"
          bun run electron:package
          package_dir="$(ls -d out/*/ | head -n 1)"
          test -n "$package_dir"
          ARDOR_ELECTRON_PACKAGE_DIR="$package_dir" bun run test:electron-package

      - name: Audit JavaScript dependencies
        run: bun audit

      - name: Verify release CLI
        run: bun run release --version
