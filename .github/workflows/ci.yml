name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  validate:
    name: Validate desktop
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.1

      - name: Restore Bun and Electron caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
            ~/Library/Caches/electron
            ~\AppData\Local\electron\Cache
          key: desktop-ci-${{ runner.os }}-${{ runner.arch }}-bun-1.3.5-electron-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            desktop-ci-${{ runner.os }}-${{ runner.arch }}-bun-1.3.5-electron-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check Electron shell
        run: bun run electron:type-check

      - name: Test Electron shell contracts
        run: |
          bun run test:electron-shell-contract
          bun run test:release-assets
          bun run test:terminal
          bun run test:terminal-native
          bun test electron/auth/*.test.ts electron/browser/*.test.ts electron/updater.test.ts

      - name: Make production ad-hoc macOS shell with a UI fixture
        working-directory: .
        env:
          ARDOR_SKIP_UI_BUILD: "true"
          ARDOR_SOLUTIONS_UI_DIR: ${{ runner.temp }}/ardor-ui
          ARDOR_ELECTRON_CHANNEL: prod
          VITE_API_URL: https://console.ardor.cloud
          VITE_AUTH0_DOMAIN: auth.ardor.cloud
          VITE_AUTH0_CLIENT_ID: prod-ci-client
        run: |
          set -euo pipefail
          mkdir -p "$ARDOR_SOLUTIONS_UI_DIR/dist"
          printf '%s\n' \
            '<!doctype html><title>Ardor UI fixture</title><meta http-equiv="Content-Security-Policy" content="connect-src https://console.ardor.cloud"><meta content="https://console.ardor.cloud auth.ardor.cloud prod-ci-client">' \
            > "$ARDOR_SOLUTIONS_UI_DIR/dist/index.html"
          export ARDOR_DESKTOP_TARGET_ARCH="$(node -p "process.arch")"
          export ARDOR_SPARKLE_FEED_URL="https://github.com/Ardor-Cerebrum/ardor-desktop/releases/download/electron-update-feed/macos-arm64.xml"
          export ARDOR_SPARKLE_PUBLIC_KEY="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          bun run electron:sparkle:rebuild
          bun scripts/electron-stage-build.mjs prod --platform darwin --arch "$ARDOR_DESKTOP_TARGET_ARCH"
          package_dir="$(find out -mindepth 1 -maxdepth 1 -type d ! -name make -print -quit)"
          test -n "$package_dir"
          ARDOR_ELECTRON_PACKAGE_DIR="$package_dir" bun run test:electron-package
          package_app="$package_dir/Ardor.app"
          test -d "$package_app"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$package_app/Contents/Info.plist")" = \
            "cloud.ardor.desktop"
          bun run verify:electron-fuses -- "$package_app"
          "$package_app/Contents/MacOS/Ardor" --ardor-terminal-smoke

          verify_ad_hoc_app() {
            app_bundle="$1"
            suffix="$2"
            codesign --verify --deep --strict --verbose=2 "$app_bundle"
            signature_details="$(codesign -dvv "$app_bundle" 2>&1)"
            printf '%s\n' "$signature_details" | grep -F 'Signature=adhoc'
            if printf '%s\n' "$signature_details" | grep -Eq '^TeamIdentifier=[A-Z0-9]+$'; then
              echo "Ad-hoc macOS CI package unexpectedly has an Apple Team identifier" >&2
              exit 1
            fi

            entitlements="$RUNNER_TEMP/ardor-ci-ad-hoc-entitlements-$suffix.plist"
            codesign -d --entitlements :- "$app_bundle" > "$entitlements" 2>/dev/null
            if grep -Fq '<key>keychain-access-groups</key>' "$entitlements"; then
              echo "Ad-hoc macOS CI package must not contain a Keychain access group" >&2
              exit 1
            fi

            runtime_config="$app_bundle/Contents/Resources/runtime-config.json"
            node -e 'const config = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if ("browserWebAuthnKeychainAccessGroup" in config || config.autoUpdateEnabled !== true) process.exit(1)' "$runtime_config"
          }
          verify_ad_hoc_app "$package_app" package

          release_tag="v$(node -p "require('./package.json').version")"
          release_dir="$PWD/dist/release"
          ditto -c -k --sequesterRsrc --keepParent "$package_app" "out/make/Ardor-${release_tag}-mac-${ARDOR_DESKTOP_TARGET_ARCH}.zip"
          node scripts/electron-release-assets.mjs darwin "$release_tag"
          dmg_asset="$release_dir/Ardor-${release_tag}-mac-${ARDOR_DESKTOP_TARGET_ARCH}-unsigned.dmg"
          test -s "$dmg_asset"
          test -s "$release_dir/Ardor-${release_tag}-mac-${ARDOR_DESKTOP_TARGET_ARCH}.zip"
          test "$(find "$release_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          hdiutil verify "$dmg_asset"
          mount_dir="$RUNNER_TEMP/ardor-dmg-mount"
          mkdir -p "$mount_dir"
          cleanup_dmg() { hdiutil detach "$mount_dir" || true; }
          trap cleanup_dmg EXIT
          hdiutil attach "$dmg_asset" -readonly -nobrowse -mountpoint "$mount_dir"
          test -d "$mount_dir/Ardor.app"
          test -L "$mount_dir/Applications"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$mount_dir/Ardor.app/Contents/Info.plist")" = \
            "cloud.ardor.desktop"
          verify_ad_hoc_app "$mount_dir/Ardor.app" dmg
          hdiutil detach "$mount_dir"
          trap - EXIT

      - name: Audit JavaScript dependencies
        # extract-zip has no patched release. The wrapper fails closed unless the only finding
        # remains on the exact Electron Packager build-only path and the exception is in date.
        run: |
          bun run test:dependency-audit
          bun run audit:dependencies

      - name: Verify release CLI
        run: bun run release --version

  make-windows:
    name: Make Windows Electron assets
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.1

      - name: Restore Bun and Electron caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
            ~/Library/Caches/electron
            ~\AppData\Local\electron\Cache
          key: desktop-ci-${{ runner.os }}-${{ runner.arch }}-bun-1.3.5-electron-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            desktop-ci-${{ runner.os }}-${{ runner.arch }}-bun-1.3.5-electron-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test terminal runtime
        timeout-minutes: 5
        run: |
          bun run test:terminal
          bun run test:terminal-native

      - name: Make and validate production unsigned Windows assets
        shell: pwsh
        run: |
          $uiDirectory = Join-Path $env:RUNNER_TEMP 'ardor-ui-dist'
          New-Item -ItemType Directory -Force -Path (Join-Path $uiDirectory 'dist') | Out-Null
          Set-Content `
            -Path (Join-Path $uiDirectory 'dist/index.html') `
            -Value '<!doctype html><title>Ardor UI fixture</title><meta http-equiv="Content-Security-Policy" content="connect-src https://console.ardor.cloud"><meta content="https://console.ardor.cloud auth.ardor.cloud prod-ci-client">' `
            -Encoding utf8
          $env:ARDOR_SKIP_UI_BUILD = 'true'
          $env:ARDOR_SOLUTIONS_UI_DIR = $uiDirectory
          $env:ARDOR_ELECTRON_CHANNEL = 'prod'
          $env:VITE_API_URL = 'https://console.ardor.cloud'
          $env:VITE_AUTH0_DOMAIN = 'auth.ardor.cloud'
          $env:VITE_AUTH0_CLIENT_ID = 'prod-ci-client'
          $env:ARDOR_WINDOWS_UPDATE_FEED_URL = 'https://github.com/Ardor-Cerebrum/ardor-desktop/releases/download/electron-update-feed/windows-x64.json'
          $env:ARDOR_WINDOWS_UPDATE_PUBLIC_KEY = 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='

          bun scripts/electron-stage-build.mjs prod --platform win32 --arch x64
          if ($LASTEXITCODE -ne 0) { throw 'Production Electron build failed' }

          $packageDirectory = Get-ChildItem -Path out -Directory |
            Where-Object { $_.Name -ne 'make' } |
            Select-Object -First 1
          if (-not $packageDirectory) { throw 'Packaged Windows application is missing' }
          $env:ARDOR_ELECTRON_PACKAGE_DIR = $packageDirectory.FullName
          bun run test:electron-package
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows application smoke test failed' }
          $packageExecutable = Join-Path $packageDirectory.FullName 'Ardor.exe'
          bun run verify:electron-fuses -- $packageExecutable
          if ($LASTEXITCODE -ne 0) { throw 'Electron fuse verification failed' }
          bun run test:electron-windows-terminal
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Electron terminal smoke failed' }

          $runtimeConfig = Get-Content (Join-Path $packageDirectory.FullName 'resources/runtime-config.json') -Raw |
            ConvertFrom-Json
          if ($runtimeConfig.autoUpdateEnabled -ne $true) {
            throw 'Unsigned Windows CI package must enable signed auto-update'
          }
          if ($runtimeConfig.windowsUpdateFeedUrl -ne $env:ARDOR_WINDOWS_UPDATE_FEED_URL) {
            throw 'Windows CI package has the wrong update feed'
          }
          if ($runtimeConfig.windowsUpdatePublicKey -ne $env:ARDOR_WINDOWS_UPDATE_PUBLIC_KEY) {
            throw 'Windows CI package has the wrong update public key'
          }
          if ($runtimeConfig.PSObject.Properties.Name -contains 'browserWebAuthnKeychainAccessGroup') {
            throw 'Unsigned Windows CI package must not contain a Browser WebAuthn access group'
          }

          $installer = Get-ChildItem -Path out/make -Recurse -File -Filter '*.exe' |
            Where-Object { $_.Name -match 'Setup' } |
            Select-Object -First 1
          if (-not $installer) { throw 'Windows setup executable is missing' }
          foreach ($candidate in @($packageExecutable, $installer.FullName)) {
            $signature = Get-AuthenticodeSignature -FilePath $candidate
            if ($signature.Status -ne 'NotSigned') {
              throw "Expected unsigned Windows executable: $candidate ($($signature.Status))"
            }
          }

          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseTag = "v$version"
          $releaseDirectory = Join-Path (Get-Location) 'dist/release'
          $env:ARDOR_DESKTOP_TARGET_ARCH = 'x64'
          node scripts/electron-release-assets.mjs win32 $releaseTag
          if ($LASTEXITCODE -ne 0) { throw 'Windows release asset validation failed' }
          $releaseAssets = @(Get-ChildItem -Path $releaseDirectory -File)
          if ($releaseAssets.Count -ne 2) { throw 'Windows CI must publish an installer and update package' }
          $expectedNames = @(
            "Ardor-$releaseTag-windows-x64-unsigned-setup.exe",
            "Ardor-$releaseTag-windows-x64-full.nupkg"
          ) | Sort-Object
          $actualNames = @($releaseAssets.Name) | Sort-Object
          if (Compare-Object $expectedNames $actualNames) {
            throw "Unexpected Windows release assets: $($actualNames -join ', ')"
          }
