name: Sync released solutions-ui

on:
  repository_dispatch:
    types: [solutions-ui-released]
  workflow_dispatch:
    inputs:
      solutions_ui_tag:
        description: Released solutions-ui tag
        required: true
        type: string
      solutions_ui_sha:
        description: Immutable solutions-ui commit SHA
        required: true
        type: string
  schedule:
    - cron: "17 */6 * * *"

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: sync-released-solutions-ui
  cancel-in-progress: false

jobs:
  update-pin:
    name: Open desktop UI pin update
    runs-on: ubuntu-latest
    env:
      UI_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.solutions_ui_tag || github.event.client_payload.tag }}
      UI_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.solutions_ui_sha || github.event.client_payload.sha }}
    steps:
      - name: Create desktop write app token
        id: desktop-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ardor-desktop
          permission-contents: write
          permission-pull-requests: write

      - name: Create read-only solutions-ui app token
        id: solutions-ui-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: solutions-ui
          permission-contents: read

      - name: Get desktop app bot user id
        id: desktop-app-user
        env:
          GH_TOKEN: ${{ steps.desktop-app-token.outputs.token }}
        run: |
          echo "user-id=$(gh api '/users/${{ steps.desktop-app-token.outputs.app-slug }}[bot]' --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Checkout desktop main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.desktop-app-token.outputs.token }}
          persist-credentials: true

      - name: Validate released tag and SHA
        env:
          GH_TOKEN: ${{ steps.solutions-ui-app-token.outputs.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            if ! [[ "$UI_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid solutions-ui release tag: $UI_TAG" >&2
              exit 1
            fi
            if ! [[ "$UI_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid solutions-ui release SHA: $UI_SHA" >&2
              exit 1
            fi

            resolved_sha="$(gh api "repos/Ardor-Cerebrum/solutions-ui/commits/${UI_TAG}" --jq .sha)"
            if [ "$resolved_sha" != "$UI_SHA" ]; then
              echo "solutions-ui tag $UI_TAG resolves to $resolved_sha, not $UI_SHA" >&2
              exit 1
            fi
          fi

          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            latest_tag="$(gh api repos/Ardor-Cerebrum/solutions-ui/releases/latest --jq .tag_name)"
            latest_sha="$(gh api "repos/Ardor-Cerebrum/solutions-ui/commits/${latest_tag}" --jq .sha)"
            if ! [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] ||
              ! [[ "$latest_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Unable to resolve the latest published solutions-ui release" >&2
              exit 1
            fi
            if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ] &&
              { [ "$latest_tag" != "$UI_TAG" ] || [ "$latest_sha" != "$UI_SHA" ]; }; then
              echo "Reconciling dispatch $UI_TAG ($UI_SHA) to latest release $latest_tag ($latest_sha)"
            fi
            echo "UI_TAG=$latest_tag" >> "$GITHUB_ENV"
            echo "UI_SHA=$latest_sha" >> "$GITHUB_ENV"
          fi

      - name: Reconcile verified pin update pull request
        env:
          BOT_NAME: ${{ steps.desktop-app-token.outputs.app-slug }}[bot]
          BOT_USER_ID: ${{ steps.desktop-app-user.outputs.user-id }}
          GH_TOKEN: ${{ steps.desktop-app-token.outputs.token }}
          REPO_READ_TOKEN: ${{ github.token }}
          SOLUTIONS_UI_TOKEN: ${{ steps.solutions-ui-app-token.outputs.token }}
        run: |
          set -euo pipefail

          branch="automation/solutions-ui-release"
          body="$(printf 'Bundle the released solutions-ui `%s` commit `%s`.\n\nTriggered automatically by the solutions-ui release workflow.' "$UI_TAG" "$UI_SHA")"
          git config user.name "$BOT_NAME"
          git config user.email "${BOT_USER_ID}+${BOT_NAME}@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Reconciliation attempt $attempt"
            existing_pr="$(
              gh pr list \
                --repo "$GITHUB_REPOSITORY" \
                --state open \
                --base main \
                --head "$branch" \
                --json url \
                --jq '.[0].url // empty'
            )"

            git fetch origin main --prune
            git switch --detach origin/main

            pinned_sha="$(node -p "JSON.parse(require('fs').readFileSync('desktop-ui-requirements.json', 'utf8')).solutionsUiRef")"
            if ! [[ "$pinned_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "desktop-ui-requirements.json must pin a lowercase 40-character commit SHA" >&2
              exit 1
            fi
            if [ "$pinned_sha" = "$UI_SHA" ]; then
              echo "solutions-ui $UI_TAG ($UI_SHA) is already pinned on main"
              exit 0
            fi

            comparison_status="$(
              GH_TOKEN="$SOLUTIONS_UI_TOKEN" \
                gh api "repos/Ardor-Cerebrum/solutions-ui/compare/${pinned_sha}...${UI_SHA}" --jq .status
            )"
            case "$comparison_status" in
              ahead)
                ;;
              behind)
                echo "Ignoring stale solutions-ui release $UI_TAG ($UI_SHA)"
                exit 0
                ;;
              *)
                echo "Released solutions-ui commit $UI_SHA is $comparison_status relative to main pin $pinned_sha" >&2
                exit 1
                ;;
            esac

            reuse_pending=false
            if [ -n "$existing_pr" ]; then
              if ! git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"; then
                echo "Existing pin branch changed while fetching it; retrying"
                continue
              fi
              pending_head="$(git rev-parse "origin/$branch")"
              pending_sha="$(git show "origin/$branch:desktop-ui-requirements.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).solutionsUiRef")"
              if ! [[ "$pending_sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Existing pin pull request must contain a lowercase 40-character commit SHA" >&2
                exit 1
              fi

              if ! pending_pr_json="$(
                gh pr view "$existing_pr" \
                  --repo "$GITHUB_REPOSITORY" \
                  --json headRefOid,state
              )"; then
                echo "Existing pin pull request changed while validating it; retrying"
                continue
              fi
              pending_pr_head="$(jq -r .headRefOid <<<"$pending_pr_json")"
              pending_pr_state="$(jq -r .state <<<"$pending_pr_json")"
              if [ "$pending_pr_state" != "OPEN" ] || [ "$pending_pr_head" != "$pending_head" ]; then
                echo "Existing pin pull request changed while validating its branch; retrying"
                continue
              fi

              if [ "$pending_sha" = "$UI_SHA" ]; then
                echo "Reusing the existing pin pull request without rewriting its head"
                PR_URL="$existing_pr"
                pushed_sha="$pending_head"
                reuse_pending=true
              else
                pending_comparison_status="$(
                  GH_TOKEN="$SOLUTIONS_UI_TOKEN" \
                    gh api "repos/Ardor-Cerebrum/solutions-ui/compare/${pending_sha}...${UI_SHA}" --jq .status
                )"
                case "$pending_comparison_status" in
                  ahead)
                    ;;
                  behind)
                    echo "Ignoring stale solutions-ui target $UI_TAG ($UI_SHA); pending pin $pending_sha is newer"
                    exit 0
                    ;;
                  *)
                    echo "Released solutions-ui commit $UI_SHA is $pending_comparison_status relative to pending pin $pending_sha" >&2
                    exit 1
                    ;;
                esac
              fi
            fi

            if [ "$reuse_pending" != "true" ]; then
              if [ -n "$existing_pr" ]; then
                if ! rewrite_pr_json="$(
                  gh pr view "$existing_pr" \
                    --repo "$GITHUB_REPOSITORY" \
                    --json autoMergeRequest,headRefOid,state
                )"; then
                  echo "Existing pin pull request changed before its branch could be rewritten; retrying"
                  continue
                fi
                rewrite_pr_head="$(jq -r .headRefOid <<<"$rewrite_pr_json")"
                rewrite_pr_state="$(jq -r .state <<<"$rewrite_pr_json")"
                if [ "$rewrite_pr_state" != "OPEN" ] || [ "$rewrite_pr_head" != "$pending_head" ]; then
                  echo "Existing pin pull request changed before its branch could be rewritten; retrying"
                  continue
                fi
                if [ "$(jq -r '.autoMergeRequest != null' <<<"$rewrite_pr_json")" = "true" ]; then
                  if ! gh pr merge --disable-auto "$existing_pr" --repo "$GITHUB_REPOSITORY"; then
                    echo "Existing pin pull request changed before automatic merge was disabled; retrying"
                    continue
                  fi
                fi
              fi

              git switch -C "$branch" origin/main
              node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const path = "desktop-ui-requirements.json";
          const requirements = JSON.parse(readFileSync(path, "utf8"));
          requirements.solutionsUiTag = process.env.UI_TAG;
          requirements.solutionsUiRef = process.env.UI_SHA;
          writeFileSync(path, `${JSON.stringify(requirements, null, 2)}\n`);
          NODE

              git add desktop-ui-requirements.json
              git commit -m "fix(release): bundle solutions-ui $UI_TAG"
              pushed_sha="$(git rev-parse HEAD)"
              remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
              if [ -n "$remote_sha" ]; then
                lease="--force-with-lease=refs/heads/$branch:$remote_sha"
              else
                lease="--force-with-lease=refs/heads/$branch:"
              fi
              if ! git push "$lease" --set-upstream origin "$branch"; then
                echo "Pin branch changed while pushing; retrying from current main"
                continue
              fi

              open_pr="$(
                gh pr list \
                  --repo "$GITHUB_REPOSITORY" \
                  --state open \
                  --base main \
                  --head "$branch" \
                  --json url \
                  --jq '.[0].url // empty'
              )"
              if [ -n "$open_pr" ]; then
                PR_URL="$open_pr"
                gh pr edit "$PR_URL" \
                  --repo "$GITHUB_REPOSITORY" \
                  --title "fix(release): bundle solutions-ui $UI_TAG" \
                  --body "$body"
              else
                if ! PR_URL="$(
                  gh pr create \
                    --repo "$GITHUB_REPOSITORY" \
                    --base main \
                    --head "$branch" \
                    --title "fix(release): bundle solutions-ui $UI_TAG" \
                    --body "$body"
                )"; then
                  echo "Pin branch or pull request changed while creating; retrying"
                  continue
                fi
              fi
            fi

            if ! current_pr_json="$(
              gh pr view "$PR_URL" \
                --repo "$GITHUB_REPOSITORY" \
                --json autoMergeRequest,headRefOid,state
            )"; then
              echo "Pin pull request changed after reconciliation; retrying from current main"
              continue
            fi
            current_head="$(jq -r .headRefOid <<<"$current_pr_json")"
            current_state="$(jq -r .state <<<"$current_pr_json")"
            if [ "$current_state" != "OPEN" ] || [ "$current_head" != "$pushed_sha" ]; then
              echo "Pin pull request changed after reconciliation; retrying from current main"
              continue
            fi
            if [ "$(jq -r '.autoMergeRequest != null' <<<"$current_pr_json")" = "true" ]; then
              if ! gh pr merge --disable-auto "$PR_URL" --repo "$GITHUB_REPOSITORY"; then
                echo "Pin pull request changed before automatic merge was disabled; retrying"
                continue
              fi
            fi

            echo "Verify exact-head merge checks for $pushed_sha"
            checks_ready=false
            for check_attempt in $(seq 1 160); do
              current_head="$(gh pr view "$PR_URL" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
              current_state="$(gh pr view "$PR_URL" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
              if [ "$current_state" != "OPEN" ] || [ "$current_head" != "$pushed_sha" ]; then
                echo "Pin pull request changed while checks were running"
                break
              fi

              checks="$(
                GH_TOKEN="$REPO_READ_TOKEN" \
                  gh api "repos/$GITHUB_REPOSITORY/commits/${pushed_sha}/check-runs?per_page=100"
              )"
              desktop_check="$(
                jq -r '
                  ([.check_runs[] | select(.name == "Validate desktop")] | sort_by(.started_at) | last // {}) |
                  [.status // "", .conclusion // "", .head_sha // ""] | @tsv
                ' <<<"$checks"
              )"
              bundle_check="$(
                jq -r '
                  ([.check_runs[] | select(.name == "Verify production desktop bundle")] | sort_by(.started_at) | last // {}) |
                  [.status // "", .conclusion // "", .head_sha // ""] | @tsv
                ' <<<"$checks"
              )"
              IFS=$'\t' read -r desktop_status desktop_conclusion desktop_head <<<"$desktop_check"
              IFS=$'\t' read -r bundle_status bundle_conclusion bundle_head <<<"$bundle_check"

              if [ "$desktop_status" = "completed" ] &&
                [ "$desktop_conclusion" = "success" ] &&
                [ "$desktop_head" = "$pushed_sha" ] &&
                [ "$bundle_status" = "completed" ] &&
                [ "$bundle_conclusion" = "success" ] &&
                [ "$bundle_head" = "$pushed_sha" ]; then
                checks_ready=true
                break
              fi

              for conclusion in "$desktop_conclusion" "$bundle_conclusion"; do
                case "$conclusion" in
                  failure|cancelled|timed_out|action_required|stale)
                    echo "Required pin check failed with conclusion: $conclusion" >&2
                    exit 1
                    ;;
                esac
              done
              sleep 15
            done

            if [ "$checks_ready" != "true" ]; then
              echo "Pin pull request did not retain a verified exact head; retrying"
              continue
            fi

            if gh pr merge --auto --squash "$PR_URL" \
              --repo "$GITHUB_REPOSITORY" \
              --match-head-commit "$pushed_sha"; then
              echo "Automatic merge enabled for verified pin update $PR_URL"
              exit 0
            fi
            echo "Pin pull request changed before automatic merge could be enabled; retrying"
          done

          echo "Unable to reconcile the latest solutions-ui release after 3 attempts" >&2
          exit 1
